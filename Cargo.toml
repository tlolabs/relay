[workspace]
members = ["crates/relay-observer-core", "crates/relay-core", "crates/relay-media-build"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

[workspace.metadata.relay.native-dependencies]
manifest = "media-dependencies.json"
builder = "cargo run --locked -p relay-media-build"
artifacts = ["ffmpeg", "ffprobe", "mediainfo"]
